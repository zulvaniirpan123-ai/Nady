<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nada – Platform Musik</title>

<style>
:root{color-scheme:dark;--bg:#130d07;--s1:#1f160d;--s2:#2c2015;--tx:#fff3e2;--mu:#b8a58d;--ac:#ffa51f;--ac2:#1a1100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:400 15px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:16px 16px 190px;max-width:720px;margin:0 auto}
h1{font-size:26px;font-weight:800;margin-bottom:14px}
h2{font-size:18px;font-weight:800;margin:22px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{background:var(--s2);padding:8px 14px;border-radius:99px;white-space:nowrap;font-weight:600}
.chip.on{background:var(--ac);color:var(--ac2)}
.row{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:10px;width:100%;text-align:left}
.row.now{background:var(--s1)}
.row.now .t{color:var(--ac)}
.cov{width:48px;height:48px;border-radius:6px;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;color:#0d0f0d99}
.meta{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.a{color:var(--mu);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.ib svg{width:22px;height:22px;fill:currentColor}
.ib.on{color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--s1);border-radius:10px;display:flex;align-items:center;gap:10px;overflow:hidden;font-weight:600;text-align:left;padding-right:8px}
.card .cov{border-radius:0;width:56px;height:56px}
input[type=text]{width:100%;background:var(--s2);border:0;border-radius:10px;padding:13px 14px;color:var(--tx);font:inherit}
.btn{background:linear-gradient(90deg,#ff8a1f,#ffc933);color:var(--ac2);font-weight:800;padding:12px 18px;border-radius:99px;display:inline-flex;gap:8px;align-items:center}
.btn.alt{background:var(--s2);color:var(--tx)}
.empty{color:var(--mu);padding:18px 4px}
nav{position:fixed;left:0;right:0;bottom:0;background:#130d07f2;display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));z-index:5;backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:6px}
nav button.on{color:var(--tx);font-weight:800}
nav svg{width:24px;height:24px;fill:currentColor}
#mini{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));background:var(--s2);border-radius:12px;z-index:4;overflow:hidden;display:none}
#mini .row{padding:8px 8px 10px}
#mini .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#ff8a1f,#ffc933);width:0}
#full{position:fixed;inset:0;background:linear-gradient(#5a3410,var(--bg) 70%);z-index:10;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
#full.open{display:flex}
#full .big{width:min(78vw,340px);aspect-ratio:1;border-radius:14px;margin:auto;font-size:80px;display:grid;place-items:center;font-weight:800;color:#0d0f0d88;box-shadow:0 20px 50px #0008}
#full .tt{font-size:22px;font-weight:800}
.seek{width:100%;accent-color:var(--ac);margin-top:14px}
.times{display:flex;justify-content:space-between;color:var(--mu);font-size:12px}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.play{width:68px;height:68px;background:var(--tx);color:var(--bg)}
.play svg{width:32px;height:32px}
#sheet{position:fixed;inset:0;background:#000a;z-index:20;display:none;align-items:flex-end}
#sheet.open{display:flex}
#sheet>div{background:var(--s1);width:100%;max-width:720px;margin:0 auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;z-index:30;display:none}
</style>
</head>
<body>
<main id="main"></main>
<div id="mini"><div class="row" data-act="open"><div class="cov" id="mc"></div><div class="meta"><div class="t" id="mt"></div><div class="a" id="ma"></div></div><span class="ib" data-act="like" id="ml"></span><span class="ib" data-act="toggle" id="mp"></span></div><div class="bar" id="mb"></div></div>
<nav id="nav"></nav>
<section id="full" aria-label="Pemutar">
  <button class="ib" data-act="close" aria-label="Tutup"><svg viewBox="0 0 24 24"><path d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
  <div class="big" id="fc"></div>
  <div style="display:flex;align-items:center;gap:8px"><div class="meta"><div class="tt t" id="ft"></div><div class="a" id="fa"></div></div><button class="ib" data-act="like" id="fl" aria-label="Sukai"></button><button class="ib" data-act="add" aria-label="Tambah ke playlist"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button></div>
  <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu">
  <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
  <div class="ctl">
    <button class="ib" data-act="shuffle" id="fs" aria-label="Acak"><svg viewBox="0 0 24 24"><path d="M17 4l4 4-4 4V9h-2.6l-3 3.5L9 15H3v-2h5.1l3.3-3.9L8 6H3V4h5.9l3.1 3.6L13.4 6H17zm0 10l4 4-4 4v-3h-3.3l-2.1-2.5 1.3-1.6 1.6 1.9H17z"/></svg></button>
    <button class="ib" data-act="prev" aria-label="Sebelumnya"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
    <button class="ib play" data-act="toggle" id="fp" aria-label="Putar/Jeda"></button>
    <button class="ib" data-act="next" aria-label="Berikutnya"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
    <button class="ib" data-act="repeat" id="fr" aria-label="Ulangi"><svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
  </div>
  <a id="fyt" class="btn alt" target="_blank" rel="noopener" style="display:none;justify-content:center;margin-top:12px">Buka di YouTube</a>
</section>
<div id="sheet"><div id="sheetbody"></div></div>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus" multiple style="position:fixed;left:-9999px;opacity:0" tabindex="-1">

<script>
const $=s=>document.querySelector(s);
const ICON={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>',heart:'<svg viewBox="0 0 24 24"><path d="M16.5 3A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 7.5 3 5.5 5.5 0 0 0 2 8.5c0 5 6 9.6 10 12.5 4-2.900 10-7.500 10-12.500A5.500 5.500 0 0 0 16.500 3z"/></svg>',heart0:'<svg viewBox="0 0 24 24"><path d="M16.5 3A5.5 5.5 0 0 0 12 5.5 5.5 5.5 0 0 0 7.5 3 5.5 5.5 0 0 0 2 8.5c0 5 6 9.6 10 12.5 4-2.900 10-7.500 10-12.500A5.500 5.500 0 0 0 16.500 3zM12 18.700C8.500 16 4 12.300 4 8.500 4 6.600 5.600 5 7.500 5c1.500 0 2.900.9 3.500 2.300h2c.6-1.400 2-2.300 3.500-2.300 1.900 0 3.500 1.600 3.500 3.500 0 3.800-4.500 7.500-8 10.200z"/></svg>',home:'<svg viewBox="0 0 24 24"><path d="M12 3 3 10v11h6v-7h6v7h6V10z"/></svg>',search:'<svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 0 1 5.600 11.200l5.100 5.100-1.400 1.400-5.100-5.100A7 7 0 1 1 10 3zm0 2a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>',lib:'<svg viewBox="0 0 24 24"><path d="M4 4h2v16H4zm4 0h2v16H8zm4.500.5 1.900-.5 4.100 15.500-1.900.5z"/></svg>'};

/* ---------- lagu bawaan (disintesis di perangkat, bebas hak cipta) ---------- */
const BUILTIN=[
 {id:'b1',title:'Senja di Kota',artist:'Nada Studio',hue:28,base:130.81,scale:[0,3,5,7,10,12],bpm:84,wave:'tri',seed:11},
 {id:'b2',title:'Hujan Pertama',artist:'Nada Studio',hue:200,base:110,scale:[0,3,7,10,12,15],bpm:70,wave:'sin',seed:23},
 {id:'b3',title:'Langkah Pagi',artist:'Nada Studio',hue:52,base:130.81,scale:[0,2,4,7,9,12],bpm:112,wave:'sq',seed:37},
 {id:'b4',title:'Malam Lofi',artist:'Nada Studio',hue:275,base:146.83,scale:[0,2,3,7,9,10],bpm:78,wave:'tri',seed:41},
 {id:'b5',title:'Pantai Sore',artist:'Nada Studio',hue:175,base:164.81,scale:[0,2,4,7,9,12],bpm:96,wave:'sin',seed:53},
 {id:'b6',title:'Kopi Pagi',artist:'Nada Studio',hue:20,base:123.47,scale:[0,2,4,5,7,9],bpm:88,wave:'tri',seed:67},
 {id:'b7',title:'Jalan Malam',artist:'Nada Studio',hue:240,base:110,scale:[0,3,5,6,7,10],bpm:100,wave:'sq',seed:71},
 {id:'b8',title:'Bintang Jatuh',artist:'Nada Studio',hue:300,base:196,scale:[0,2,3,7,8,12],bpm:66,wave:'sin',seed:83},
 {id:'b9',title:'Sawah Hijau',artist:'Nada Studio',hue:110,base:130.81,scale:[0,2,5,7,9,12],bpm:104,wave:'tri',seed:97},
 {id:'b10',title:'Ombak Tenang',artist:'Nada Studio',hue:190,base:98,scale:[0,4,7,11,12,16],bpm:60,wave:'sin',seed:101}
];
function synth(t){
  const sr=22050,step=30/t.bpm,N=Math.floor(64*step*sr),o=new Float32Array(N);let s=t.seed;
  const r=()=>(s=s*16807%2147483647)/2147483647;
  const add=(i,f,d,v)=>{const st=Math.floor(i*step*sr),L=Math.floor(d*sr);let ph=0;
    for(let k=0;k<L&&st+k<N;k++){ph+=2*Math.PI*f/sr;const e=Math.min(1,k/300)*Math.exp(-3.2*k/L);
      const w=t.wave=='sin'?Math.sin(ph):t.wave=='tri'?Math.asin(Math.sin(ph))*0.64:Math.sign(Math.sin(ph))*.35;
      o[st+k]+=v*e*w}};
  const fr=n=>t.base*Math.pow(2,n/12);
  for(let i=0;i<64;i++){
    if(i%8==0)add(i,fr(t.scale[(i/8*2)%t.scale.length]-12),step*7,.5);
    if(i%4==0)add(i,fr(t.scale[(i/4*3)%t.scale.length]),step*3,.18);
    if(r()>.3)add(i,fr(t.scale[Math.floor(r()*t.scale.length)]+(r()>.6?12:0)),step*1.8,.28);
  }
  let m=0;for(const x of o)m=Math.max(m,Math.abs(x));
  const b=new DataView(new ArrayBuffer(44+N*2)),w=(p,x)=>[...x].forEach((c,j)=>b.setUint8(p+j,c.charCodeAt(0)));
  w(0,'RIFF');b.setUint32(4,36+N*2,true);w(8,'WAVEfmt ');b.setUint32(16,16,true);b.setUint16(20,1,true);b.setUint16(22,1,true);
  b.setUint32(24,sr,true);b.setUint32(28,sr*2,true);b.setUint16(32,2,true);b.setUint16(34,16,true);w(36,'data');b.setUint32(40,N*2,true);
  for(let i=0;i<N;i++)b.setInt16(44+i*2,Math.max(-1,Math.min(1,o[i]/m*.85))*32767,true);
  return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}

/* ---------- state ---------- */
let tracks=[],tab='home',q='',view=null,queue=[],qi=-1,shuffle=false,repeat=0,addId=null,newPl=false;
let saved={};try{saved=JSON.parse(localStorage.getItem('nada')||'{}')}catch(e){}
let liked=new Set((saved.liked||[]).filter(i=>!/^b\d/.test(i))),playlists=(saved.playlists||[{id:'p1',name:'Favorit Harian',ids:[]}]).map(p=>({...p,ids:p.ids.filter(i=>!/^b\d/.test(i))}));
const save=()=>{try{localStorage.setItem('nada',JSON.stringify({liked:[...liked],playlists,gains,bassG}))}catch(e){}};
const audio=new Audio();
ICON.fx='<svg viewBox="0 0 24 24"><path d="M4 18h2V9H4zm4 0h2V4H8zm4 0h2v-7h-2zm4 0h2V6h-2zm4 0h2v-4h-2z"/></svg>';
let ac,an,bass,bands=[],gains=saved.gains||[0,0,0,0,0],bassG=saved.bassG||0,vraf=0,db;
const EQF=[60,230,910,3600,14000],PRE={Normal:[0,0,0,0,0],Bass:[6,4,0,-1,-1],Vokal:[-2,0,4,3,0],Treble:[-2,-1,0,4,6],Pop:[-1,3,4,2,-1],Rock:[5,3,-1,3,5]};
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();const s=ac.createMediaElementSource(audio);bass=ac.createBiquadFilter();bass.type='lowshelf';bass.frequency.value=100;s.connect(bass);let p=bass;bands=EQF.map(f=>{const b=ac.createBiquadFilter();b.type='peaking';b.frequency.value=f;b.Q.value=1;p.connect(b);p=b;return b});an=ac.createAnalyser();an.fftSize=128;p.connect(an);an.connect(ac.destination);applyEq()}catch(e){ac=null}}
function applyEq(){if(!ac)return;bands.forEach((b,i)=>b.gain.value=gains[i]);bass.gain.value=bassG}
function FXHTML(){return `<h1>Efek suara</h1><canvas id='viz' width='640' height='220' style='width:100%;height:160px;background:var(--s1);border-radius:12px' aria-label='Visualizer'></canvas><h2>Equalizer</h2><div class='chips'>${Object.keys(PRE).map(k=>`<button class='chip ${PRE[k].join()==gains.join()?'on':''}' data-act='pre' data-k='${k}'>${k}</button>`).join('')}</div><div style='margin-top:8px'>${EQF.map((f,i)=>`<div style='display:flex;align-items:center;gap:10px;margin:10px 0'><span class='a' style='width:52px'>${f>=1000?f/1000+'k':f} Hz</span><input class='seek' style='margin:0' type='range' min='-12' max='12' value='${gains[i]}' data-band='${i}' aria-label='${f} Hz'><span class='a' style='width:34px;text-align:right' id='gv${i}'>${gains[i]}</span></div>`).join('')}</div><h2>Bass boost</h2><div style='display:flex;align-items:center;gap:10px'><input class='seek' style='margin:0' type='range' min='0' max='12' value='${bassG}' id='bassr' aria-label='Bass boost'><span class='a' style='width:60px;text-align:right' id='bassv'>+${bassG} dB</span></div><p class='a' style='margin-top:14px'>Efek aktif setelah lagu pertama diputar. Tidak berlaku untuk video YouTube.</p>`}
function viz(){cancelAnimationFrame(vraf);const c=$('#viz');if(!c)return;const x=c.getContext('2d'),d=new Uint8Array(64);const draw=()=>{if(!document.body.contains(c))return;vraf=requestAnimationFrame(draw);x.clearRect(0,0,c.width,c.height);if(an)an.getByteFrequencyData(d);const n=32,w=c.width/n;for(let i=0;i<n;i++){const h=Math.max(4,d[i]/255*c.height*.95);x.fillStyle=`hsl(${24+i*1.2} 95% ${50+d[i]/14}%)`;x.beginPath();if(x.roundRect)x.roundRect(i*w+3,c.height-h,w-6,h,6);else x.rect(i*w+3,c.height-h,w-6,h);x.fill()}};draw()}
function plrows(pl){listOf('v',pl.ids);return pl.ids.map((id,i)=>{const t=T(id);return t?`<div style='display:flex;align-items:center'><div style='flex:1;min-width:0'>${trow(t,'v',i)}</div><div style='display:flex;flex-direction:column'><button class='ib' style='width:32px;height:28px' data-act='mv' data-i='${i}' data-d='-1' aria-label='Naik'>▲</button><button class='ib' style='width:32px;height:28px' data-act='mv' data-i='${i}' data-d='1' aria-label='Turun'>▼</button></div><button class='ib' data-act='rm' data-i='${i}' aria-label='Hapus dari playlist'>✕</button></div>`:''}).join('')||'<div class="empty">Playlist masih kosong.</div>'}
function idb(){return new Promise(res=>{try{const r=indexedDB.open('nada-lib',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>res(null)}catch(e){res(null)}})}
async function loadLib(){db=await idb();if(!db)return;try{db.transaction('s').objectStore('s').getAll().onsuccess=e=>{e.target.result.forEach(r=>tracks.push({id:r.id,title:r.title,artist:r.artist,hue:r.hue,src:URL.createObjectURL(r.blob)}));render()}}catch(x){}}
function putSong(r){try{db&&db.transaction('s','readwrite').objectStore('s').put(r)}catch(e){}}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.band!==undefined){gains[+t.dataset.band]=+t.value;$('#gv'+t.dataset.band).textContent=t.value;applyEq();save()}else if(t.id=='bassr'){bassG=+t.value;$('#bassv').textContent='+'+bassG+' dB';applyEq();save()}});
loadLib();
const T=id=>tracks.find(x=>x.id==id);
const cov=(t,c='')=>`<div class="cov ${c}" style="background:linear-gradient(135deg,hsl(${t.hue} 70% 62%),hsl(${(t.hue+50)%360} 60% 38%))">${t.title[0]}</div>`;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}

/* ---------- pemutar ---------- */
function play(list,i){queue=list;qi=i;const t=T(queue[qi]);if(!t)return;
  if(t.yt){audio.pause();audio.removeAttribute('src');ui();$('#full').classList.add('open');return}
  initAudio();if(ac&&ac.state=='suspended')ac.resume();updateMS(t);
  if(!t.src)t.src=synth(t);audio.src=t.src;audio.play().catch(()=>{});ui()}
function step(d,auto){
  if(!queue.length)return;
  if(auto&&repeat==2){audio.currentTime=0;audio.play();return}
  let n=shuffle&&queue.length>1?Math.floor(Math.random()*queue.length):qi+d;
  if(n>=queue.length){if(repeat==1||!auto)n=0;else{ui();return}}
  if(n<0)n=queue.length-1;
  play(queue,n)}
audio.onended=()=>step(1,true);
audio.onerror=()=>toast('Lagu tidak bisa diputar. Coba format MP3, M4A, atau WAV.');
audio.ontimeupdate=()=>{const p=audio.duration?audio.currentTime/audio.duration:0;
  $('#mb').style.width=p*100+'%';if(!seeking)$('#seek').value=p*1000;$('#cur').textContent=fmt(audio.currentTime);$('#dur').textContent=fmt(audio.duration)};
audio.onplay=audio.onpause=()=>ui(true);
let seeking=false;const sk=$('#seek');
sk.oninput=()=>{seeking=true};sk.onchange=()=>{if(audio.duration)audio.currentTime=sk.value/1000*audio.duration;seeking=false};

function ui(light){
  const t=T(queue[qi]);$('#mini').style.display=t?'block':'none';
  const ic=audio.paused?ICON.play:ICON.pause;$('#mp').innerHTML=ic;$('#fp').innerHTML=ic;
  if(t){$('#mc').outerHTML=cov(t).replace('class="cov "','class="cov" id="mc"');
    $('#mt').textContent=$('#ft').textContent=t.title;$('#ma').textContent=$('#fa').textContent=t.artist;
    const f=$('#fc');f.className='big';f.style.background=`linear-gradient(135deg,hsl(${t.hue} 70% 62%),hsl(${(t.hue+50)%360} 60% 38%))`;if(t.yt){f.style.background='#000';f.style.aspectRatio='16/9';f.style.width='100%';f.style.overflow='hidden';const k='yt'+t.yt;if(f.dataset.k!=k){f.dataset.k=k;f.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${t.yt}?autoplay=1&playsinline=1&rel=0" style="width:100%;height:100%;border:0;border-radius:14px" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen title="YouTube"></iframe>`}}else{f.dataset.k='';f.style.aspectRatio='';f.style.width='';f.style.overflow='';f.textContent=t.title[0]}
    const y=$('#fyt');y.style.display=t.yt?'flex':'none';if(t.yt)y.href='https://www.youtube.com/watch?v='+t.yt;$('#seek').style.visibility=t.yt?'hidden':'';
    const h=liked.has(t.id)?ICON.heart:ICON.heart0;$('#ml').innerHTML=h;$('#fl').innerHTML=h;
    $('#ml').className=$('#fl').className='ib'+(liked.has(t.id)?' on':'');}
  $('#fs').className='ib'+(shuffle?' on':'');$('#fr').className='ib'+(repeat?' on':'');
  $('#fr').style.opacity=repeat==2?'1':'';$('#fr').title=['Ulangi: mati','Ulangi semua','Ulangi satu'][repeat];
  if(!light)render();
}

/* ---------- tampilan ---------- */
const trow=(t,list,i)=>`<div class="row ${queue[qi]==t.id?'now':''}"><button class="row" style="padding:0;flex:1;min-width:0" data-act="play" data-i="${i}" data-l="${list}">${cov(t)}<div class="meta"><div class="t">${t.title}</div><div class="a">${t.artist}</div></div></button><button class="ib ${liked.has(t.id)?'on':''}" data-act="likeid" data-id="${t.id}" aria-label="Sukai">${liked.has(t.id)?ICON.heart:ICON.heart0}</button><button class="ib" data-act="addid" data-id="${t.id}" aria-label="Tambah ke playlist"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button></div>`;
const lists={};
function listOf(name,ids){lists[name]=ids;return name}
function tl(name,ids){listOf(name,ids);return ids.map(T).filter(Boolean).map((t,i)=>trow(t,name,i)).join('')||'<div class="empty">Belum ada lagu di sini.</div>'}

function render(){
  const m=$('#main');let h='';
  if(view){const pl=view=='liked'?{name:'Lagu Disukai',ids:[...liked]}:playlists.find(p=>p.id==view);
    h=`<button class="chip" data-act="back">‹ Kembali</button><h1 style="margin-top:14px">${pl.name}</h1><button class="btn" data-act="playall" data-l="v">${ICON.play.replace('<svg','<svg width=20 height=20 fill=currentColor')} Putar semua</button><div style="margin-top:12px">${view=='liked'?tl('v',pl.ids):plrows(pl)}</div>`}
  else if(tab=='home'){
    h=`<h1>Beranda</h1><div class="grid">${playlists.slice(0,4).map(p=>`<button class="card" data-act="openpl" data-id="${p.id}">${cov({title:p.name,hue:(p.name.length*47)%360})}<span>${p.name}</span></button>`).join('')}</div>
    <h2>Semua lagu</h2>${tl('all',tracks.map(t=>t.id))}
    <h2>Dari HP-mu</h2><label for="file" class="btn alt" style="cursor:pointer">+ Tambah lagu dari HP</label><p class="a" style="margin-top:8px">Lagu yang kamu tambah tersimpan di browser ini dan tetap ada saat dibuka lagi.</p>
    `}
  else if(tab=='search'){
    const res=tracks.filter(t=>(t.title+' '+t.artist).toLowerCase().includes(q.toLowerCase())).map(t=>t.id);
    h=`<h1>Cari</h1><input type="text" id="q" placeholder="Judul atau artis" value="${q.replace(/"/g,'&quot;')}" aria-label="Cari lagu"><div style="margin-top:12px">${tl('s',res)}</div>`}
  else if(tab=='fx'){h=FXHTML()}
  else{
    h=`<h1>Koleksi</h1><button class="card" style="width:100%;margin-bottom:10px" data-act="openpl" data-id="liked">${cov({title:'♥',hue:30})}<span>Lagu Disukai · ${liked.size}</span></button>
    ${playlists.map(p=>`<button class="card" style="width:100%;margin-bottom:10px" data-act="openpl" data-id="${p.id}">${cov({title:p.name,hue:(p.name.length*47)%360})}<span>${p.name} · ${p.ids.length}</span></button>`).join('')}
    ${newPl?`<input type="text" id="npl" placeholder="Nama playlist baru" aria-label="Nama playlist"><button class="btn" style="margin-top:8px" data-act="mkpl">Buat playlist</button>`:`<button class="btn alt" data-act="newpl">+ Playlist baru</button>`}`}
  m.innerHTML=h;viz();
  const qq=$('#q');if(qq){qq.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
  $('#nav').innerHTML=[['home','Beranda','home'],['search','Cari','search'],['lib','Koleksi','lib'],['fx','Efek','fx']].map(([k,l,i])=>`<button class="${tab==(k=='lib'?'lib':k)&&!view?'on':''}" data-act="tab" data-t="${k}">${ICON[i]}${l}</button>`).join('');
}

function openSheet(id){addId=id;const t=T(id);
  $('#sheetbody').innerHTML=`<div class="t" style="font-weight:800;margin-bottom:8px">Tambah “${t.title}” ke…</div>${playlists.map(p=>`<button class="row" data-act="topl" data-id="${p.id}"><div class="meta t">${p.name}</div><span class="a">${p.ids.includes(id)?'✓ sudah ada':''}</span></button>`).join('')}<div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="snp" placeholder="Playlist baru" aria-label="Playlist baru"><button class="btn" data-act="mkpl2">Buat</button></div>`;
  $('#sheet').classList.add('open')}
const closeSheet=()=>$('#sheet').classList.remove('open');

document.addEventListener('click',e=>{
  if(e.target==$('#sheet'))return closeSheet();
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,d=b.dataset;
  const cur=queue[qi];
  switch(a){
    case 'tab':tab=d.t;view=null;newPl=false;render();scrollTo(0,0);break;
    case 'play':play(lists[d.l],+d.i);break;
    case 'playall':if(lists[d.l].length){shuffle=false;play(lists[d.l],0)}break;
    case 'toggle':e.stopPropagation();if(!cur)play(tracks.map(t=>t.id),0);else if(T(cur).yt)$('#full').classList.add('open');else audio.paused?audio.play():audio.pause();break;
    case 'next':step(1);break;case 'prev':if(audio.currentTime>3)audio.currentTime=0;else step(-1);break;
    case 'shuffle':shuffle=!shuffle;ui(true);break;
    case 'repeat':repeat=(repeat+1)%3;ui(true);toast(['Ulangi: mati','Ulangi semua','Ulangi satu lagu'][repeat]);break;
    case 'open':if(cur){$('#full').classList.add('open');ui(true)}break;
    case 'close':{$('#full').classList.remove('open');const c=T(cur);if(c&&c.yt){$('#fc').dataset.k='';$('#fc').innerHTML=''}break}
    case 'addyt':{const m=$('#yl').value.trim().match(/(?:youtu\.be\/|v=|shorts\/|embed\/|live\/)([\w-]{11})/);
      if(!m){toast('Link YouTube tidak dikenali');break}
      const id='y'+m[1];let t=T(id);
      if(!t){t={id,yt:m[1],title:$('#yn').value.trim()||'Video YouTube',artist:'YouTube',hue:0};tracks.push(t)}
      play(tracks.map(x=>x.id),tracks.indexOf(t));break}
    case 'like':e.stopPropagation();if(cur){liked.has(cur)?liked.delete(cur):liked.add(cur);save();ui()}break;
    case 'likeid':liked.has(d.id)?liked.delete(d.id):liked.add(d.id);save();render();ui(true);break;
    case 'add':if(cur)openSheet(cur);break;
    case 'addid':openSheet(d.id);break;
    case 'topl':{const p=playlists.find(p=>p.id==d.id);if(!p.ids.includes(addId)){p.ids.push(addId);save();toast('Ditambahkan ke '+p.name)}closeSheet();render();break}
    case 'mkpl2':{const n=$('#snp').value.trim();if(!n)break;const p={id:'p'+Date.now(),name:n,ids:[addId]};playlists.push(p);save();closeSheet();toast('Playlist “'+n+'” dibuat');render();break}
    case 'newpl':newPl=true;render();$('#npl').focus();break;
    case 'mkpl':{const n=$('#npl').value.trim();if(n){playlists.push({id:'p'+Date.now(),name:n,ids:[]});save()}newPl=false;render();break}
    case 'openpl':view=d.id;render();scrollTo(0,0);break;
    case 'back':view=null;render();break;
    case 'pre':gains=[...PRE[d.k]];applyEq();save();render();break;
    case 'mv':{const p=playlists.find(p=>p.id==view),i=+d.i,j=i+ +d.d;if(p&&j>=0&&j<p.ids.length){[p.ids[i],p.ids[j]]=[p.ids[j],p.ids[i]];save();render()}break}
    case 'rm':{const p=playlists.find(p=>p.id==view);if(p){p.ids.splice(+d.i,1);save();render()}break}
    case 'upload':$('#file').click();break;
  }
});
$('#file').onchange=e=>{
  const fs=[...e.target.files];fs.forEach((f,i)=>{
    const id='u'+Date.now()+i,name=f.name.replace(/\.[^.]+$/,'');
    const hue=Math.floor(Math.random()*360);tracks.push({id,title:name,artist:'Dari HP',hue,src:URL.createObjectURL(f)});putSong({id,title:name,artist:'Dari HP',hue,blob:f});});
  if(fs.length){toast(fs.length+' lagu ditambahkan');render()}e.target.value=''};
function updateMS(t){if(!('mediaSession' in navigator)||!window.MediaMetadata)return;try{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,256,256);g.addColorStop(0,`hsl(${t.hue} 70% 62%)`);g.addColorStop(1,`hsl(${(t.hue+50)%360} 60% 38%)`);x.fillStyle=g;x.fillRect(0,0,256,256);x.fillStyle='#0d0f0d99';x.font='800 120px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(t.title[0],128,138);navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.artist,album:'Nada',artwork:[{src:c.toDataURL('image/png'),sizes:'256x256',type:'image/png'}]})}catch(e){}}
if('mediaSession' in navigator){const m=navigator.mediaSession,h=(k,f)=>{try{m.setActionHandler(k,f)}catch(e){}};h('play',()=>audio.play());h('pause',()=>audio.pause());h('nexttrack',()=>step(1));h('previoustrack',()=>step(-1));h('seekto',e=>{if(e.seekTime!=null)audio.currentTime=e.seekTime});h('seekbackward',()=>{audio.currentTime=Math.max(0,audio.currentTime-10)});h('seekforward',()=>{audio.currentTime+=10})}
render();
</script>
</body>
</html>
